!
! OFFICE-SW1
! Generated by subnetplan for network "single-site".
! Replace every CHANGE-ME before using this configuration.
!
service password-encryption
no ip domain-lookup
hostname OFFICE-SW1
ip domain-name office.example
enable secret CHANGE-ME
username admin privilege 15 secret CHANGE-ME
!
vlan 10
 name staff
vlan 20
 name printers
vlan 30
 name guests
!
interface GigabitEthernet0/1
 description Trunk to OFFICE-R1
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30
 switchport nonegotiate
!
interface range FastEthernet0/1 - 16
 description staff
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 spanning-tree bpduguard enable
!
interface range FastEthernet0/17 - 20
 description printers
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
 spanning-tree bpduguard enable
!
interface range FastEthernet0/21 - 24
 description guests
 switchport mode access
 switchport access vlan 30
 switchport port-security
 switchport port-security maximum 1
 switchport port-security mac-address sticky
 switchport port-security violation restrict
 spanning-tree portfast
 spanning-tree bpduguard enable
!
interface GigabitEthernet0/2
 description unused
 shutdown
!
banner motd #Authorized access only. Activity is logged.#
!
line console 0
 login local
 logging synchronous
 exec-timeout 10 0
line vty 0 15
 login local
 transport input ssh
 exec-timeout 10 0
!
ip ssh version 2
!
end
