!
! OFFICE-R1
! Generated by subnetplan for network "single-site".
! Replace every CHANGE-ME before using this configuration.
!
service password-encryption
no ip domain-lookup
hostname OFFICE-R1
ip domain-name office.example
enable secret CHANGE-ME
username admin privilege 15 secret CHANGE-ME
!
ip dhcp excluded-address 192.168.10.1
ip dhcp excluded-address 192.168.10.65
!
ip dhcp pool STAFF
 network 192.168.10.0 255.255.255.192
 default-router 192.168.10.1
 dns-server 9.9.9.9
 domain-name office.example
!
ip dhcp pool GUESTS
 network 192.168.10.64 255.255.255.224
 default-router 192.168.10.65
 dns-server 9.9.9.9
 domain-name office.example
!
interface GigabitEthernet0/0
 description Trunk to OFFICE-SW1
 no ip address
 no shutdown
!
interface GigabitEthernet0/0.10
 description staff
 encapsulation dot1Q 10
 ip address 192.168.10.1 255.255.255.192
 ip nat inside
!
interface GigabitEthernet0/0.20
 description printers
 encapsulation dot1Q 20
 ip address 192.168.10.97 255.255.255.240
 ip nat inside
!
interface GigabitEthernet0/0.30
 description guests
 encapsulation dot1Q 30
 ip address 192.168.10.65 255.255.255.224
 ip nat inside
!
interface GigabitEthernet0/1
 description Internet uplink
 ip address 198.51.100.6 255.255.255.252
 ip nat outside
 no shutdown
!
ip route 0.0.0.0 0.0.0.0 198.51.100.5
!
access-list 1 permit 192.168.10.0 0.0.0.255
ip nat inside source list 1 interface GigabitEthernet0/1 overload
!
banner motd #Authorized access only. Activity is logged.#
!
line console 0
 login local
 logging synchronous
 exec-timeout 10 0
line vty 0 4
 login local
 transport input ssh
 exec-timeout 10 0
!
ip ssh version 2
!
end
