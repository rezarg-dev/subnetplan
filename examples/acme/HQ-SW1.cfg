!
! HQ-SW1
! Generated by subnetplan for network "acme".
! Replace every CHANGE-ME before using this configuration.
!
service password-encryption
no ip domain-lookup
hostname HQ-SW1
ip domain-name acme.example
enable secret CHANGE-ME
username admin privilege 15 secret CHANGE-ME
!
vlan 10
 name staff
vlan 20
 name engineering
vlan 30
 name servers
vlan 99
 name management
vlan 999
 name native
!
interface GigabitEthernet0/1
 description Trunk to HQ-R1
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,99
 switchport nonegotiate
!
interface range FastEthernet0/1 - 12
 description staff
 switchport mode access
 switchport access vlan 10
 switchport port-security
 switchport port-security maximum 2
 switchport port-security mac-address sticky
 switchport port-security violation restrict
 spanning-tree portfast
 spanning-tree bpduguard enable
!
interface range FastEthernet0/13 - 16
 description engineering
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
 spanning-tree bpduguard enable
!
interface range FastEthernet0/17 - 20
 description servers
 switchport mode access
 switchport access vlan 30
 spanning-tree portfast
 spanning-tree bpduguard enable
!
interface FastEthernet0/21
 description management
 switchport mode access
 switchport access vlan 99
 spanning-tree portfast
 spanning-tree bpduguard enable
!
interface range FastEthernet0/22 - 24
 description unused
 shutdown
!
interface GigabitEthernet0/2
 description unused
 shutdown
!
interface Vlan99
 description management
 ip address 10.20.1.162 255.255.255.240
 no shutdown
!
ip default-gateway 10.20.1.161
!
banner motd #Authorized access only. Activity is logged.#
!
line console 0
 login local
 logging synchronous
 exec-timeout 10 0
line vty 0 15
 login local
 transport input ssh
 exec-timeout 10 0
!
ip ssh version 2
!
end
