!
! HQ-R1
! Generated by subnetplan for network "acme".
! Replace every CHANGE-ME before using this configuration.
!
service password-encryption
no ip domain-lookup
hostname HQ-R1
ip domain-name acme.example
enable secret CHANGE-ME
username admin privilege 15 secret CHANGE-ME
!
ip dhcp excluded-address 10.20.0.1
ip dhcp excluded-address 10.20.1.1
!
ip dhcp pool STAFF
 network 10.20.0.0 255.255.255.0
 default-router 10.20.0.1
 dns-server 9.9.9.9
 domain-name acme.example
!
ip dhcp pool ENGINEERING
 network 10.20.1.0 255.255.255.128
 default-router 10.20.1.1
 dns-server 9.9.9.9
 domain-name acme.example
!
interface GigabitEthernet0/0
 description Trunk to HQ-SW1
 no ip address
 no shutdown
!
interface GigabitEthernet0/0.10
 description staff
 encapsulation dot1Q 10
 ip address 10.20.0.1 255.255.255.0
 ip nat inside
!
interface GigabitEthernet0/0.20
 description engineering
 encapsulation dot1Q 20
 ip address 10.20.1.1 255.255.255.128
 ip nat inside
!
interface GigabitEthernet0/0.30
 description servers
 encapsulation dot1Q 30
 ip address 10.20.1.129 255.255.255.224
 ip nat inside
!
interface GigabitEthernet0/0.99
 description management
 encapsulation dot1Q 99
 ip address 10.20.1.161 255.255.255.240
 ip nat inside
!
interface GigabitEthernet0/0.999
 description native VLAN, no hosts
 encapsulation dot1Q 999 native
!
interface GigabitEthernet0/1
 description Link to NORTH-R1
 ip address 10.20.2.193 255.255.255.252
 ip nat inside
 no shutdown
!
interface Serial0/0/0
 description Link to SOUTH-R1
 ip address 10.20.2.197 255.255.255.252
 ip nat inside
 no shutdown
!
interface GigabitEthernet0/2
 description Internet uplink
 ip address 203.0.113.2 255.255.255.252
 ip nat outside
 no shutdown
!
router ospf 1
 router-id 1.1.1.1
 passive-interface default
 no passive-interface GigabitEthernet0/1
 no passive-interface Serial0/0/0
 network 10.20.0.0 0.0.0.255 area 0
 network 10.20.1.0 0.0.0.127 area 0
 network 10.20.1.128 0.0.0.31 area 0
 network 10.20.1.160 0.0.0.15 area 0
 network 10.20.2.192 0.0.0.3 area 0
 network 10.20.2.196 0.0.0.3 area 0
 default-information originate
!
ip route 0.0.0.0 0.0.0.0 203.0.113.1
!
access-list 1 permit 10.20.0.0 0.0.7.255
ip nat inside source list 1 interface GigabitEthernet0/2 overload
!
banner motd #Authorized access only. Activity is logged.#
!
line console 0
 login local
 logging synchronous
 exec-timeout 10 0
line vty 0 4
 login local
 transport input ssh
 exec-timeout 10 0
!
ip ssh version 2
!
end
