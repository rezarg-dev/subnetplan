!
! SOUTH-R1
! Generated by subnetplan for network "acme".
! Replace every CHANGE-ME before using this configuration.
!
service password-encryption
no ip domain-lookup
hostname SOUTH-R1
ip domain-name acme.example
enable secret CHANGE-ME
username admin privilege 15 secret CHANGE-ME
!
ip dhcp excluded-address 10.20.2.129
!
ip dhcp pool STAFF
 network 10.20.2.128 255.255.255.224
 default-router 10.20.2.129
 dns-server 9.9.9.9
 domain-name acme.example
!
interface GigabitEthernet0/0
 description Trunk to SOUTH-SW1
 no ip address
 no shutdown
!
interface GigabitEthernet0/0.10
 description staff
 encapsulation dot1Q 10
 ip address 10.20.2.129 255.255.255.224
!
interface GigabitEthernet0/0.99
 description management
 encapsulation dot1Q 99
 ip address 10.20.2.161 255.255.255.240
!
interface GigabitEthernet0/0.999
 description native VLAN, no hosts
 encapsulation dot1Q 999 native
!
interface Serial0/0/0
 description Link to HQ-R1
 ip address 10.20.2.198 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description Link to NORTH-R1
 ip address 10.20.2.202 255.255.255.252
 no shutdown
!
router ospf 1
 router-id 3.3.3.3
 passive-interface default
 no passive-interface Serial0/0/0
 no passive-interface GigabitEthernet0/1
 network 10.20.2.128 0.0.0.31 area 0
 network 10.20.2.160 0.0.0.15 area 0
 network 10.20.2.196 0.0.0.3 area 0
 network 10.20.2.200 0.0.0.3 area 0
!
banner motd #Authorized access only. Activity is logged.#
!
line console 0
 login local
 logging synchronous
 exec-timeout 10 0
line vty 0 4
 login local
 transport input ssh
 exec-timeout 10 0
!
ip ssh version 2
!
end
