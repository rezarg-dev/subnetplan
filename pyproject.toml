[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "subnetplan"
version = "0.1.0"
description = "Plan a VLSM addressing scheme for a multi-site network and generate Cisco IOS configuration for it"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Reza Ghaderi" }]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
subnetplan = "subnetplan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
